<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.l{font-size:24px}.s{font-size:20px}.box{fill:#f7fbff;stroke:#2b6cb0;stroke-width:3}.arrow{stroke:#111;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="600" y="45" text-anchor="middle" class="t">C/D → 数字滤波 → D/C 完整链路（据 PPT 第87页重绘）</text><text x="35" y="190" class="l">xₐ(t)</text><rect x="140" y="120" width="190" height="110" rx="10" class="box"/><text x="235" y="165" text-anchor="middle" class="l">C/D</text><text x="235" y="202" text-anchor="middle" class="s">采样周期 T₁</text><rect x="470" y="120" width="240" height="110" rx="10" class="box"/><text x="590" y="165" text-anchor="middle" class="l">H(e^{jω})</text><text x="590" y="202" text-anchor="middle" class="s">数字 LTI 系统</text><rect x="850" y="120" width="190" height="110" rx="10" class="box"/><text x="945" y="165" text-anchor="middle" class="l">D/C</text><text x="945" y="202" text-anchor="middle" class="s">恢复周期 T₂</text><text x="1085" y="190" class="l">yₐ(t)</text><line x1="88" y1="175" x2="135" y2="175" class="arrow"/><line x1="330" y1="175" x2="465" y2="175" class="arrow"/><line x1="710" y1="175" x2="845" y2="175" class="arrow"/><line x1="1040" y1="175" x2="1080" y2="175" class="arrow"/><text x="380" y="150" text-anchor="middle" class="s">x[n]</text><text x="775" y="150" text-anchor="middle" class="s">y[n]</text><text x="600" y="300" text-anchor="middle" class="l">输入侧：ω=ΩinT₁　　输出侧：Ωout=ω/T₂</text></svg>