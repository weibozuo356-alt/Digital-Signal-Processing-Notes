<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.l{font-size:24px}.s{font-size:20px}.box{fill:#f7fbff;stroke:#2b6cb0;stroke-width:3}.arrow{stroke:#111;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="600" y="45" text-anchor="middle" class="t">由采样序列重构带限信号（据 PPT 第84页重绘）</text><text x="50" y="190" class="l">x[n]</text><rect x="150" y="115" width="250" height="120" rx="12" class="box"/><text x="275" y="160" text-anchor="middle" class="l">序列 → 冲激串</text><text x="275" y="198" text-anchor="middle" class="s">xₛ(t)=Σx[n]δ(t−nT)</text><rect x="500" y="115" width="260" height="120" rx="12" class="box"/><text x="630" y="160" text-anchor="middle" class="l">恢复滤波器</text><text x="630" y="198" text-anchor="middle" class="s">Hᵣ(jΩ)：理想低通</text><text x="865" y="190" class="l">xᵣ(t)</text><line x1="95" y1="175" x2="145" y2="175" class="arrow"/><line x1="400" y1="175" x2="495" y2="175" class="arrow"/><line x1="760" y1="175" x2="850" y2="175" class="arrow"/><text x="600" y="305" text-anchor="middle" class="l">恢复条件：Ωₘ &lt; Ωc &lt; Ωₜ − Ωₘ</text><text x="600" y="350" text-anchor="middle" class="l">通带增益取 T，可补偿采样产生的 1/T 幅度尺度</text></svg>