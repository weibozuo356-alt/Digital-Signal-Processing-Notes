<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.l{font-size:23px}.s{font-size:20px}.box{fill:#fff;stroke:#2b6cb0;stroke-width:3}.arrow{stroke:#111;stroke-width:3;marker-end:url(#a)}.axis{stroke:#111;stroke-width:2}.spec{fill:none;stroke:#2b6cb0;stroke-width:4}.filt{fill:none;stroke:#c53030;stroke-width:4}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="600" y="42" text-anchor="middle" class="t">教材题 2.5-2：系统与频谱（据教材第37页重绘）</text><text x="30" y="125" class="l">x_c(t)</text><rect x="120" y="80" width="170" height="90" rx="10" class="box"/><text x="205" y="120" text-anchor="middle" class="l">C/D</text><text x="205" y="150" text-anchor="middle" class="s">T₁</text><rect x="420" y="80" width="220" height="90" rx="10" class="box"/><text x="530" y="135" text-anchor="middle" class="l">H(e^{jω})</text><rect x="770" y="80" width="170" height="90" rx="10" class="box"/><text x="855" y="120" text-anchor="middle" class="l">D/C</text><text x="855" y="150" text-anchor="middle" class="s">T₂</text><text x="1010" y="125" class="l">y_c(t)</text><line x1="80" y1="125" x2="115" y2="125" class="arrow"/><line x1="290" y1="125" x2="415" y2="125" class="arrow"/><line x1="640" y1="125" x2="765" y2="125" class="arrow"/><line x1="940" y1="125" x2="1005" y2="125" class="arrow"/><text x="355" y="102" class="s">x[n]</text><text x="700" y="102" class="s">y[n]</text><text x="65" y="240" class="l">输入频谱 X_c(jΩ)</text><line x1="90" y1="430" x2="520" y2="430" class="axis"/><line x1="300" y1="270" x2="300" y2="455" class="axis"/><path d="M120 430 L300 300 L480 430" class="spec"/><text x="105" y="465" class="s">−10000π</text><text x="285" y="465" class="s">0</text><text x="445" y="465" class="s">10000π</text><text x="285" y="292" class="s">1</text><text x="650" y="240" class="l">数字滤波器 H(e^{jω})</text><line x1="670" y1="430" x2="1120" y2="430" class="axis"/><line x1="890" y1="270" x2="890" y2="455" class="axis"/><path d="M760 430 L760 315 L1020 315 L1020 430" class="filt"/><text x="735" y="465" class="s">−π/2</text><text x="875" y="465" class="s">0</text><text x="1000" y="465" class="s">π/2</text><text x="1030" y="318" class="s">1</text><text x="600" y="535" text-anchor="middle" class="l">第(4)问：1/T₁=10⁴ Hz，1/T₂=2×10⁴ Hz</text><text x="600" y="575" text-anchor="middle" class="s">固定流程：先查混叠 → ω=ΩT₁ → 乘 H(e^{jω}) → Ω=ω/T₂ → 恢复滤波</text></svg>