<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.l{font-size:22px}.axis{stroke:#111;stroke-width:2}.spec{fill:none;stroke:#2b6cb0;stroke-width:4}.alias{fill:none;stroke:#c53030;stroke-width:4}</style><text x="600" y="42" text-anchor="middle" class="t">采样频谱：不混叠与混叠（据 PPT 第82页重绘）</text><text x="50" y="92" class="l">(a) Ωₜ &gt; 2Ωₘ：频谱副本彼此分离</text><line x1="70" y1="250" x2="1130" y2="250" class="axis"/><path d="M130 250 L210 140 L290 250" class="spec"/><path d="M500 250 L580 140 L660 250" class="spec"/><path d="M870 250 L950 140 L1030 250" class="spec"/><text x="195" y="282" class="l">−Ωₜ</text><text x="565" y="282" class="l">0</text><text x="935" y="282" class="l">Ωₜ</text><text x="455" y="320" class="l">每一份宽约 2Ωₘ，相邻中心间隔 Ωₜ</text><text x="50" y="382" class="l">(b) Ωₜ &lt; 2Ωₘ：相邻副本发生重叠 → 混叠</text><line x1="70" y1="545" x2="1130" y2="545" class="axis"/><path d="M230 545 L430 420 L630 545" class="spec"/><path d="M500 545 L700 420 L900 545" class="alias"/><path d="M770 545 L970 420 L1130 520" class="spec"/><text x="625" y="585" class="l">重叠区域中的频率成分已无法区分</text></svg>